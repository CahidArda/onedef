name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Example MCP workflow server (scripted agent over HTTP)
        run: pnpm --filter @example/mcp-workflow-server test
      - name: Quick start example builds
        run: pnpm --filter @example/quickstart build
      - name: Docs site builds
        run: pnpm --filter @onedef/site build

  evals:
    name: Agent eval (eve, scripted model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: eve eval
        working-directory: examples/mcp-workflow/agent
        run: pnpm eval
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eve-evals
          path: examples/mcp-workflow/agent/.eve/evals/
